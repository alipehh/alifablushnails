<!DOCTYPE html>
<html>
<head>
    <title>Blush Nail Studio</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #FF1493;
            font-family: 'Poppins', sans-serif;
        }

        /* ================= HEADER ================= */

        header {
            width: 100%;
            height: 500px;
            background-color: #FF6EC7;
            background-image:
                linear-gradient(rgba(255, 110, 199, 0.35), rgba(255, 110, 199, 0.35)),
                url('gjwhf.jfif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 20px;
        }

        header h1 {
            font-family: 'Allura', cursive;
            font-size: 70px;
            font-weight: 400;
            color: #FCFDAF;
            margin: 0;
            letter-spacing: 2px;
            line-height: 1;
            text-shadow: 2px 3px 8px rgba(80, 30, 60, 0.25);
        }

        header p {
            color: #E9FF9A;
            font-size: 13px;
            letter-spacing: 3px;
            font-weight: 500;
            margin: 12px 0 0;
            text-shadow: 1px 2px 5px rgba(80, 30, 60, 0.25);
        }


        /* ================= NAVBAR ================= */

        nav {
            width: 100%;
            background-color: #315C3C3A;
            text-align: center;
            padding: 16px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
        }

        nav a {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin: 0 10px;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s;
        }

        nav a:hover {
            background-color: #7FFFD4;
            color: #315C3C;
            transform: translateY(-2px);
        }


        /* ================= IFRAME ================= */

        .frame-container {
            width: 100%;
            padding: 35px 20px;
            text-align: center;
        }

        iframe {
            width: 95%;
            height: 570px;
            border: none;
            border-radius: 25px;
            background-color: #93C572;

            box-shadow:
                0 8px 25px rgba(70, 30, 50, 0.20);

            transition: 0.3s;
        }

        iframe:hover {
            box-shadow:
                0 12px 35px rgba(70, 30, 50, 0.28);
        }


        /* ================= FOOTER ================= */

        footer {
            text-align: center;
            padding: 20px;
            color: white;
            font-size: 11px;
            letter-spacing: 1px;
        }

        footer p {
            margin: 0;
        }

    </style>
</head>

<body>

    <header>
        <h1>Blush Nail Studio</h1>
        <p>BEAUTIFUL COLORS · BEAUTIFUL YOU</p>
    </header>


    <nav>
        <a href="home.html" target="isi">Home</a>
        <a href="profil.html" target="isi">Profil</a>
        <a href="kontak.html" target="isi">Kontak</a>
        <a href="products2.html" target="isi">Products</a>
        <a href="sumber.html" target="isi">Sumber</a>
    </nav>


    <div class="frame-container">
        <iframe src="home.html" name="isi"></iframe>
    </div>


    <footer>
        <p>© 2026 Blush Nail Studio</p>
    </footer>

</body>
</html>
