<!DOCTYPE html>
<html>
<head>
    <title>Kontak</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap');

        body {
            margin: 0;
            background-color: #7FFFD4;
            font-family: 'Poppins', sans-serif;
            color: #315C3A;
        }

        .kontak {
            text-align: center;
            padding: 45px 30px;
        }

        .label {
            color: #E91E63;
            font-size: 12px;
            letter-spacing: 3px;
            font-weight: 600;
        }

        .kontak h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 55px;
            color: #E91E63;
            margin: 10px 0;
        }

        .kontak > p {
            color: #777;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .contact-box {
            max-width: 520px;
            margin: auto;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .contact-item {
            width: 140px;
            padding: 20px 10px;
            background-color: white;
            border-radius: 20px;
            border-bottom: 5px solid #FC0FC0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .contact-item:hover {
            transform: translateY(-7px);
            border-bottom-color: #E91E63;
        }

        .contact-item .icon {
            font-size: 25px;
        }

        .contact-item h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            color: #315C3A;
            margin: 8px 0;
        }

        .contact-item p {
            font-size: 11px;
            color: #888;
            word-break: break-word;
        }
    </style>
</head>

<body>

    <div class="kontak">

        <div class="label">SAY HELLO</div>

        <h1>Let's Talk! ♡</h1>

        <p>
            Punya pertanyaan atau mau order? Contact us!
        </p>

        <div class="contact-box">

            <div class="contact-item">
                <div class="icon">♡</div>
                <h2>Instagram</h2>
                <p>@blushnailstudio</p>
            </div>

            <div class="contact-item">
                <div class="icon">✆</div>
                <h2>WhatsApp</h2>
                <p>0831-1234-0567</p>
            </div>

            <div class="contact-item">
                <div class="icon">✉</div>
                <h2>Email</h2>
                <p>blushnailstudio@gmail.com</p>
            </div>

        </div>

    </div>

</body>
</html>
